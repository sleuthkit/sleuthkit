name: FlashFX Reliance Nitro integration
on:
  push:
    branches: [feature/datalight-reliance]
  pull_request:
    paths: ['tsk/**', 'tests/reliance*', '.github/workflows/reliance-native-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Gerd1986/qnxprobe
          ref: dfa12f2231ef5900ade8fb61aefd6166357ebdcc
          path: reference-qnxprobe
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libsqlite3-dev libssl-dev zlib1g-dev
      - name: Build native TSK
        run: |
          autoreconf -fi
          ./configure --disable-java --without-afflib --without-libewf
          make -j2 -C tsk
          make -j2 -C tools/fstools
          g++ -std=c++17 -I . tests/reliance_read_probe.cpp -L tsk/.libs -Wl,-rpath,"$PWD/tsk/.libs" -ltsk -o reliance-read-probe
      - name: Native regressions
        run: python3 tests/reliance_regression.py --tools tools/fstools --reference reference-qnxprobe --read-probe "$PWD/reliance-read-probe"
      - uses: actions/upload-artifact@v4
        with:
          name: datalight-reliance-linux-cli
          path: |
            tools/fstools/.libs/*
            tsk/.libs/libtsk.so*
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/checkout@v4
        with:
          repository: Gerd1986/qnxprobe
          ref: dfa12f2231ef5900ade8fb61aefd6166357ebdcc
          path: reference-qnxprobe
      - name: Build native Windows including JNI
        shell: pwsh
        run: |
          $env:TSK_HOME = (Get-Location).Path
          $env:JDK_HOME = $env:JAVA_HOME
          $env:INCLUDE = "$env:INCLUDE;$env:JAVA_HOME/include;$env:JAVA_HOME/include/win32"
          python win32/updateAndBuildAll.py -m
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
      - name: Package CLI and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'release/reliance-windows' | Out-Null
          Get-ChildItem win32 -Recurse -File | Where-Object { $_.FullName -match '[\\/](Release_NoLibs|Release)[\\/]' -and $_.Extension -in '.exe','.dll' } | Copy-Item -Destination 'release/reliance-windows' -Force
          $env:PATH = "$PWD/release/reliance-windows;" + $env:PATH
          python tests/reliance_regression.py --tools release/reliance-windows --reference reference-qnxprobe
          if ($LASTEXITCODE -ne 0) { throw 'Reliance regressions failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: datalight-reliance-windows-cli
          path: release/reliance-windows
