name: QNX4 native reader and TSK integration
on:
  push:
    branches: [feature/qnx4, develop-4.1x]
  pull_request:
    paths: ['tsk/**', 'tests/qnx4*', '.github/workflows/qnx4-native-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abrignoni/qnxprobe
          ref: de0e352b466e2e165cf5dd38652b11515ccf58f4
          path: reference-qnxprobe
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libsqlite3-dev libssl-dev zlib1g-dev
      - name: Build TSK
        run: |
          autoreconf -fi
          ./configure --disable-java --without-afflib --without-libewf
          make -j2 -C tsk
          make -j2 -C tools/fstools
          make -j2 -C tools/vstools
      - name: File hashes, extent chains, allocation and malformed inputs
        run: python3 tests/qnx4_regression.py --tools tools/fstools --reference reference-qnxprobe
      - uses: actions/upload-artifact@v4
        with:
          name: qnx4-linux-cli
          path: |
            tools/fstools/.libs/fls
            tools/fstools/.libs/icat
            tools/fstools/.libs/fsstat
            tools/fstools/.libs/blkls
            tools/fstools/.libs/ils
            tools/fstools/.libs/istat
            tools/vstools/.libs/mmls
            tsk/.libs/libtsk.so*
