name: NAND LBA mapping release
on:
  push:
    branches:
      - feature/nand-lba-mapping
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v4.15.0-nand-lba.1)'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: nand-lba-release
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Gerd1986/qnxprobe
          ref: dfa12f2231ef5900ade8fb61aefd6166357ebdcc
          path: reference-qnxprobe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential ant ivy libsqlite3-dev libssl-dev zlib1g-dev libafflib-dev libewf-dev
      - name: Configure and build
        run: |
          autoreconf -fi
          ./configure --prefix="$PWD/_install"
          make -j2
          make install
      - name: Validate release FTL100 readers
        run: |
          g++ -std=c++17 -I . tests/ftl100_read_probe.cpp -L tsk/.libs -Wl,-rpath,"$PWD/tsk/.libs" -ltsk -o ftl100-read-probe
          python3 tests/ftl100_regression.py --tools tools/fstools --img-tools tools/imgtools --reference reference-qnxprobe --read-probe "$PWD/ftl100-read-probe"
      - name: Validate NAND ECC and LBA mapping using built native tools
        run: |
          python3 tests/flash_preprocess_regression.py
          python3 tests/nand_lba_regression.py --fixture synthetic-nand --tools tools/fstools
          python3 tests/nand_lba_package.py synthetic-nand NAND_LBA_ECC_FAT32_Testpaket.zip
      - name: Package binaries and Java bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/linux-x64/bin release/linux-x64/lib release/java
          find _install/bin -maxdepth 1 -type f -exec cp {} release/linux-x64/bin/ \;
          find _install/lib -maxdepth 1 -type f -name '*.so*' -exec cp -L {} release/linux-x64/lib/ \;
          find bindings/java -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -exec cp {} release/java/ \;
          test -n "$(find release/java -name '*.jar' -print -quit)"
          echo 'Java artifacts:'
          find release/java -name '*.jar' -print
          test -n "$(find release/linux-x64/bin -type f -print -quit)"
          mkdir -p release/linux-x64/flash_preprocessor/profiles
          cp tools/flash/*.py tools/flash/LICENSE.txt docs/NAND_LBA_MAPPING.md docs/UBI_PREPROCESSOR.md release/linux-x64/flash_preprocessor/
          cp config/flash_devices/*.json config/flash_devices/README.md release/linux-x64/flash_preprocessor/profiles/
          python3 release/linux-x64/flash_preprocessor/preprocess_ubi.py --list-profiles
          tar -czf sleuthkit-linux-x64.tar.gz -C release linux-x64
          (cd release/java && zip -r ../../sleuthkit-java.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-java
          path: |
            sleuthkit-linux-x64.tar.gz
            sleuthkit-java.zip
            NAND_LBA_ECC_FAT32_Testpaket.zip
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/checkout@v4
        with:
          repository: Gerd1986/qnxprobe
          ref: dfa12f2231ef5900ade8fb61aefd6166357ebdcc
          path: reference-qnxprobe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build native Windows x64 and JNI
        shell: pwsh
        run: |
          $env:TSK_HOME = (Get-Location).Path
          $env:JDK_HOME = $env:JAVA_HOME
          $env:INCLUDE = "$env:INCLUDE;$env:JAVA_HOME/include;$env:JAVA_HOME/include/win32"
          if (-not (Test-Path "$env:JAVA_HOME/include/jni.h")) { throw "Missing JDK JNI header" }
          Write-Host "JNI header found: $env:JAVA_HOME/include/jni.h"
          python win32/updateAndBuildAll.py -m
      - name: Build Windows JNI JAR
        shell: pwsh
        working-directory: bindings/java
        run: |
          ant clean
          if ($LASTEXITCODE -ne 0) { throw 'Ant clean failed' }
          ant dist
          if ($LASTEXITCODE -ne 0) { throw 'Ant dist failed' }
          $entries = & jar tf dist/sleuthkit-4.15.0.jar
          if ($LASTEXITCODE -ne 0 -or -not ($entries -contains 'NATIVELIBS/amd64/win/libtsk_jni.dll')) { throw 'Windows JNI missing from JAR' }
      - name: Package and smoke-test Windows executables and JNI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'release/windows-x64'
          New-Item -ItemType Directory -Force $out | Out-Null
          $bins = @(Get-ChildItem win32 -Recurse -File | Where-Object {
            $_.FullName -match '[\\/](Release_NoLibs|Release)[\\/]' -and
            $_.Extension -in '.exe','.dll'
          })
          $exes = @($bins | Where-Object Extension -eq '.exe')
          $jni = @($bins | Where-Object Name -eq 'libtsk_jni.dll')
          if ($exes.Count -eq 0) { throw 'No native Windows executables produced' }
          if ($jni.Count -eq 0) { throw 'libtsk_jni.dll missing from native build' }
          $exes | Copy-Item -Destination $out -Force
          $jni | Select-Object -First 1 | Copy-Item -Destination $out -Force
          # Copy locally built native dependencies when present.
          $otherDlls = @($bins | Where-Object { $_.Extension -eq '.dll' -and $_.Name -ne 'libtsk_jni.dll' })
          $otherDlls | Copy-Item -Destination $out -Force
          # Fail if any shipped binary imports a DLL that is neither packaged
          # nor part of Windows / the documented VC++ runtime.
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbin) {
            $dumpbinPath = $dumpbin.Source
          } else {
            $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
            if (-not (Test-Path $vswhere)) { throw 'vswhere.exe missing; cannot locate Visual Studio tools' }
            $vsPath = (& $vswhere -latest -products '*' -property installationPath).Trim()
            if (-not $vsPath) { throw 'Visual Studio installation not found' }
            $candidates = @(Get-ChildItem (Join-Path $vsPath 'VC/Tools/MSVC') -Recurse -File -Filter dumpbin.exe |
              Where-Object { $_.FullName -match '[\\/]Hostx64[\\/]x64[\\/]dumpbin.exe$' } |
              Sort-Object FullName -Descending)
            if ($candidates.Count -eq 0) { throw 'dumpbin.exe not found in Visual Studio x64 toolchain' }
            $dumpbinPath = $candidates[0].FullName
          }
          Write-Host "Using dumpbin: $dumpbinPath"
          $systemDlls = @(Get-ChildItem "$env:WINDIR/System32" -Filter '*.dll' -File | ForEach-Object Name)
          $systemDlls += @(Get-ChildItem "$env:WINDIR/SysWOW64" -Filter '*.dll' -File | ForEach-Object Name)
          $systemDlls += @('api-ms-win-*.dll','ext-ms-win-*.dll')
          $shipped = @(Get-ChildItem $out -File | ForEach-Object Name)
          $missing = @()
          foreach ($binary in @(Get-ChildItem $out -File | Where-Object { $_.Extension -in '.exe','.dll' })) {
            $imports = & $dumpbinPath /dependents $binary.FullName 2>&1
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed: $($binary.Name)" }
            foreach ($line in $imports) {
              if ($line -match '^\s*([A-Za-z0-9_.-]+\.dll)\s*$') {
                $dep = $Matches[1]
                if ($dep -in $shipped -or $dep -in $systemDlls -or $dep -like 'api-ms-win-*.dll' -or $dep -like 'ext-ms-win-*.dll') { continue }
                $missing += "$($binary.Name) -> $dep"
              }
            }
          }
          if ($missing.Count -gt 0) { throw ("Unpackaged DLL dependencies:`n" + ($missing -join "`n")) }
          # Use -V where supported; a nonzero exit code is not necessarily
          # a load failure, so check specifically for Windows loader errors.
          foreach ($exe in @(Get-ChildItem $out -Filter '*.exe')) {
            $proc = Start-Process -FilePath $exe.FullName -ArgumentList '-V' -WorkingDirectory (Resolve-Path $out).Path -PassThru -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/$($exe.BaseName).stdout" -RedirectStandardError "$env:RUNNER_TEMP/$($exe.BaseName).stderr"
            if ($proc.ExitCode -in @(-1073741515,-1073741701)) { throw "Windows loader failure for $($exe.Name): $($proc.ExitCode)" }
            Write-Host "$($exe.Name): exit $($proc.ExitCode)"
          }
          python tests/ftl100_regression.py --tools $out --reference reference-qnxprobe
          if ($LASTEXITCODE -ne 0) { throw 'FTL100 regression suite failed for packaged Windows tools' }
          python tests/flash_preprocess_regression.py
          if ($LASTEXITCODE -ne 0) { throw 'Existing ECC regression failed' }
          python tests/nand_lba_regression.py --fixture synthetic-nand --tools $out
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows FAT32 and LBA mapping regression failed' }
          New-Item -ItemType Directory -Force "$out/flash_preprocessor/profiles" | Out-Null
          Copy-Item tools/flash/*.py,tools/flash/LICENSE.txt,docs/NAND_LBA_MAPPING.md,docs/UBI_PREPROCESSOR.md "$out/flash_preprocessor/" -Force
          Copy-Item config/flash_devices/*.json,config/flash_devices/README.md "$out/flash_preprocessor/profiles/" -Force
          python "$out/flash_preprocessor/preprocess_ubi.py" --list-profiles
          if ($LASTEXITCODE -ne 0) { throw 'Packaged NAND profile validation failed' }
          Copy-Item bindings/java/dist/sleuthkit-4.15.0.jar $out/ -Force
          Compress-Archive -Path "$out/*" -DestinationPath sleuthkit-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: sleuthkit-windows-x64.zip
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Resolve and validate release tag
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == v*-nand-lba.* ]]; then
            tag="$REF_NAME"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="v4.15.0-nand-lba.$RUN_NUMBER"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-nand-lba[.][0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing release $tag"
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum sleuthkit-* NAND_LBA_ECC_FAT32_Testpaket.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: artifacts/*
          name: Sleuthkit ${{ steps.version.outputs.tag }} — NAND LBA mapping and BCH
          body: |
            Sleuth Kit develop with configurable NAND page-to-LBA reconstruction.
            Includes the existing native filesystem readers and FTL100 automatic detection.

            The standalone Python preprocessor corrects BCH codewords, extracts protected
            LBA/sequence metadata and reconstructs logical sector images. Profiles specify
            duplicate selection and missing-sector policy. The JSON report records original
            physical offsets, selected mappings, discarded duplicates and hashes.

            Windows and Linux packages contain CLI tools plus flash_preprocessor/ with
            the standalone scripts, profiles and documentation. Python 3 is required.
            This NAND mapping feature is preprocessing; selecting the raw dump in Autopsy
            does not automatically invoke it. It is not yet bundled into the Autopsy GUI.

            NAND_LBA_ECC_FAT32_Testpaket.zip contains a synthetic shuffled NAND dump,
            device profile, corrected FAT32 reference and reconstruction, tooling and report.
            Six injected data/metadata/parity errors, stale duplicates and erased pages
            are verified; both files are read by native fsstat/fls/icat with matching hashes.
            The synthetic config does not describe a real vendor/controller format.

            Assets: Windows x64 CLI/DLL/JNI ZIP, Linux x64 tools, Java bindings,
            synthetic NAND test package and SHA256SUMS.txt. Prerelease for validation.
          generate_release_notes: false

